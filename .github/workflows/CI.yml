name: CI
on:
  - push
  - pull_request
jobs:
  test:
    timeout-minutes: 10
    name: Julia ${{ matrix.version }} - cputhreads=${{ matrix.juliacputhreads }} juliathreads=${{ matrix.juliathreads }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x86
          - x64
        juliacputhreads:
          - 1
          - 3
        juliathreads:
          - 1
          - 2
          - 4
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.juliathreads }}
          JULIA_CPU_THREADS: ${{ matrix.juliacputhreads }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v3
        with:
          file: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
        env:
          JULIA_PKG_SERVER: ""
      - run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using Polyester
            DocMeta.setdocmeta!(Polyester, :DocTestSetup, :(using Polyester); recursive=true)
            doctest(Polyester)'
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
